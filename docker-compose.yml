version: '3.8'

services:

  franchise-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franchise-api
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}
    networks:
      - franchise-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  franchise-network:
    driver: bridge